services:
  bot:
    build: .
    container_name: music_bot
    restart: always
    env_file:
      - .env
    volumes:
      - ./bot.db:/app/bot.db
      - ./downloads:/app/downloads
      # Agar cookies.txt faylingiz bo'lsa, uni quyidagicha ulashingiz mumkin:
      # - ./cookies.txt:/app/cookies.txt
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
